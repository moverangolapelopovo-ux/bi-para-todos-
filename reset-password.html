</head>
<body>
<main class="wrap">

<form id="resetForm" class="hidden">

<label>Confirmar palavra-passe<input id="confirmPassword" type="password" minlength="8" required></label>
<button type="submit">GUARDAR NOVA PALAVRA-PASSE</button>
</form>
<p id="message"></p>
<p><a href="admin.html">Voltar ao painel</a></p>
</section>
</main>
